name: EvalCI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Optional reviewed full baseline SHA'
        required: false
        type: string

# Push checks test branch heads; PR checks test GitHub merge commits. They are
# distinct revisions. Cancel obsolete runs within each branch/PR, not across them.
concurrency:
  group: evalci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context:
    name: Resolve Evaluation Revisions
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.context.outputs.candidate_sha }}
      baseline_sha: ${{ steps.context.outputs.baseline_sha }}
      baseline_policy: ${{ steps.context.outputs.baseline_policy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve candidate and baseline
        id: context
        env:
          EVALCI_BASELINE_SHA: ${{ vars.EVALCI_BASELINE_SHA }}
        run: python3 -m scripts.ci_context

  unit-tests:
    name: Unit and Contract Tests
    runs-on: ubuntu-24.04
    needs: context
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install locked runtime and test tools
        run: |
          python -m pip install uv==0.13.6
          uv pip install --system --require-hashes -r requirements.lock
          uv pip install --system -r requirements-test.txt
          uv pip check --system
      - name: Run Python and JavaScript contract tests
        run: |
          python -m pytest -q
          node --test tests/test_stream_client.cjs
          python -m compileall -q api core db rag_target scripts tests

  rag-regression:
    name: Deterministic RAG Integration
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Evaluate actual candidate against baseline RAG source
        env:
          CANDIDATE_SHA: ${{ needs.context.outputs.candidate_sha }}
          BASELINE_SHA: ${{ needs.context.outputs.baseline_sha }}
        run: >-
          python -m scripts.ci --candidate-sha "$CANDIDATE_SHA" --baseline-sha "$BASELINE_SHA"
          --mode fixture --output artifacts/ci-fixture --archive-images
      - name: Upload required evaluation evidence and tested images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluated-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixture/
          if-no-files-found: error
          retention-days: 14

  live-evaluation:
    name: Live RAG Evaluation
    needs: [context, unit-tests, rag-regression]
    if: >-
      vars.EVALCI_ENABLE_LIVE_EVAL == 'true' &&
      ((github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        vars.EVALCI_ALLOW_SAME_REPO_LIVE_PR == 'true'))
    environment: evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evaluated-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tested-images
      - name: Live evaluation of the same image bytes
        env:
          CANDIDATE_SHA: ${{ needs.context.outputs.candidate_sha }}
          BASELINE_SHA: ${{ needs.context.outputs.baseline_sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
          EVAL_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_GENERATION_MODEL: ${{ vars.GEMINI_GENERATION_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
        run: >-
          python -m scripts.ci --candidate-sha "$CANDIDATE_SHA" --baseline-sha "$BASELINE_SHA"
          --mode ragas --output artifacts/ci-live --reuse-images artifacts/tested-images
          --timeout-seconds 1800
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-evaluation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-live/
          if-no-files-found: error
          retention-days: 30

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [context, unit-tests, rag-regression, live-evaluation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require successful checks and configured live policy
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_LIVE: ${{ vars.EVALCI_REQUIRE_LIVE_EVAL == 'true' && 'true' || 'false' }}
        run: python3 -m scripts.ci_policy --jobs "$JOB_RESULTS" --require-live "$REQUIRE_LIVE"
      - name: Record validation mode
        if: always()
        env:
          LIVE_RESULT: ${{ needs.live-evaluation.result }}
          REQUIRE_LIVE: ${{ vars.EVALCI_REQUIRE_LIVE_EVAL }}
        run: |
          echo 'Deterministic checks use synthetic contract scores; they do not validate live LLM quality.' >> "$GITHUB_STEP_SUMMARY"
          echo "Live evaluation result: $LIVE_RESULT. Required by policy: $REQUIRE_LIVE." >> "$GITHUB_STEP_SUMMARY"

  delivery:
    name: Deliver Tested Image to GHCR
    needs: [context, quality-gate, rag-regression, live-evaluation]
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.EVALCI_ENABLE_DELIVERY == 'true' &&
      needs.quality-gate.result == 'success' && needs.rag-regression.result == 'success' &&
      needs.live-evaluation.result == 'success'
    environment: delivery
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evaluated-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tested-images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: live-evaluation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live-evidence
      - name: Verify and publish the already-tested versioned image
        env:
          CANDIDATE_SHA: ${{ needs.context.outputs.candidate_sha }}
          BASELINE_SHA: ${{ needs.context.outputs.baseline_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          EVALCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVALCI_ENABLE_DELIVERY: ${{ vars.EVALCI_ENABLE_DELIVERY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install pydantic==2.13.5
          IMAGE_NAME="ghcr.io/${RELEASE_REPOSITORY,,}"
          python -m scripts.deliver --bundle artifacts/tested-images --live-evidence artifacts/live-evidence --expected-sha "$CANDIDATE_SHA" --baseline-sha "$BASELINE_SHA" --image-name "$IMAGE_NAME" --publish --output delivery.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-${{ github.sha }}-${{ github.run_id }}
          path: delivery.json
          if-no-files-found: error
