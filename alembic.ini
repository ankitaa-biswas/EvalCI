# alembic.ini — EvalCI Alembic configuration
# Documentation: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts directory (relative to this file).
script_location = db/migrations

# Template for autogenerated revision filenames.
# %(rev)s  — short revision id
# %(slug)s — slug derived from the revision message
file_template = %%(rev)s_%%(slug)s

# Encoding used for .py migration files.
output_encoding = utf-8

# Database URL.  Overridden at runtime by db/migrations/env.py which reads the
# DATABASE_URL environment variable, so this placeholder value is never used
# directly.  Set DATABASE_URL in your .env file before running migrations.
sqlalchemy.url = %(DATABASE_URL)s


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
